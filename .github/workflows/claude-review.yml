name: Claude Review

# PR을 열 때 한 번 자동으로 리뷰한다.
# 그 뒤 다시 보고 싶으면 PR에 `@claude` 를 멘션해서 수동으로 부른다.
# synchronize(푸시마다 실행)는 일부러 뺐다 — 커밋 하나당 리뷰 한 번은 과하다.
on:
  pull_request:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  # PR이 열릴 때 자동 실행
  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            PR 브랜치는 이미 현재 작업 디렉터리에 체크아웃되어 있다.

            먼저 `AGENTS.md`를 읽어라. 그것이 이 레포의 개발 규칙이고, 리뷰 기준이다.
            디자인이 걸린 변경이면 `docs/DESIGN.md`도 읽어라.

            그다음 `gh pr diff`로 변경분을 보고 아래 순서로 검토한다.

            1. 버그 — 실제로 잘못 동작하는 지점. 재현 조건을 함께 적어라.
            2. AGENTS.md 규칙 위반. 특히 자주 깨지는 것들:
               - 규칙 1·2 — 이미 있는 함수·컴포넌트를 두고 새로 만들었는가
               - 규칙 3 — 같은 사실이 두 곳에 적혔는가 (토큰, 스키마, 규칙)
               - 규칙 8 — 스키마를 바꿨는데 `types/database.ts`를 다시 생성하지 않았는가
               - 규칙 9 — 서버 진입점에서 검증하는가. 소유권 체크를 앱 코드에 흩뿌렸는가
               - 규칙 10 — 로딩·빈 상태·에러 3종이 다 있는가
               - 규칙 11 — PR에 기능이 두 개 이상 섞였는가
               - 스타일 — 토큰 대신 임의 값(`p-[13px]`, `text-[#333]`)을 썼는가
            3. 더 단순하게 쓸 수 있는 곳. 지울 수 있는 코드.

            리뷰 원칙:
            - **한국어로 쓴다.**
            - 포맷·네이밍은 지적하지 마라. Biome이 CI에서 이미 본다.
            - 추측으로 지적하지 마라. 근거는 `파일:줄`이다. 확신이 없으면 질문으로 적어라.
            - 문제가 없으면 없다고 한 줄로 끝내라. 억지로 만들어내지 마라.
            - 심각한 것부터 적어라. 사소한 취향 차이는 아예 적지 마라.

            구체적인 코드 지점은 `mcp__github_inline_comment__create_inline_comment`로
            (`confirmed: true`) 인라인 코멘트를 달아라.
            전체 총평은 `gh pr comment`로 한 번만 남겨라.
            리뷰 내용을 메시지로만 출력하지 말고 반드시 GitHub에 남겨라.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"

  # `@claude` 멘션으로 수동 호출. 댓글 내용이 그대로 지시가 된다.
  #
  # 멘션이 없는 댓글은 여기서 걸러 러너를 아예 띄우지 않는다.
  # 액션 안에도 같은 검사가 있지만("No trigger was met for @claude") 그건
  # 러너 기동 + 체크아웃 + 의존성 설치를 다 마친 뒤에 도는 코드다.
  # 이 조건이 없으면 봇 댓글에도 20초짜리 빈 실행이 붙는다.
  mention:
    if: >-
      github.event_name != 'pull_request' &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
